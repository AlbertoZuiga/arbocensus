name: Deploy

on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (default: production)"
        required: false
        default: production

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-backend:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects uppercase in image references; the owner login is mixed case
      - name: Lowercase owner
        id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile
          target: prod
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/arbocensus-backend:production
            ghcr.io/${{ steps.owner.outputs.lc }}/arbocensus-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push caddy+frontend
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile
          target: prod
          push: true
          build-args: VITE_API_URL=/api
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/arbocensus-caddy:production
            ghcr.io/${{ steps.owner.outputs.lc }}/arbocensus-caddy:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build-backend, build-frontend]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy to droplet
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_TOKEN
          script: |
            cd /srv/arbocensus
            # The compose file and scripts live in the droplet's checkout, not in the
            # images: without this they stay frozen at whatever was cloned first.
            # .env and data/osm are gitignored, so the reset does not touch them.
            git fetch --prune origin production
            git reset --hard origin/production
            IMAGE_TAG="${{ inputs.image_tag || 'production' }}"
            sed -i '/^IMAGE_TAG=/d' .env
            echo "IMAGE_TAG=$IMAGE_TAG" >> .env
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.production.yml pull
            docker logout ghcr.io
            docker compose -f docker-compose.production.yml up -d --remove-orphans
            docker image prune -f
